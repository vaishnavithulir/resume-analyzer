services:
  # Backend Spring Boot API Web Service (Free Tier)
  - type: web
    name: resuvantage-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/v1/resumes/history
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
      - key: AI_API_KEY
        sync: false

  # Frontend React 18 Static Site (Free Tier)
  - type: static
    name: resuvantage-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    rootDir: frontend
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resuvantage-backend
          property: host
