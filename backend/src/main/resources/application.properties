# Server Configuration
server.port=8080
server.servlet.context-path=

# Multipart File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration (Persistent with MySQL mode support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled for security)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application-Specific Resume Parser Settings
app.upload.max-file-size-bytes=5242880
app.upload.allowed-extensions=pdf,docx,doc
app.upload.allowed-mime-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword

# CORS Configuration (allows frontend development server and production domains)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.pages.dev,https://*.onrender.com,https://*.github.io,https://*.is-a.dev,https://*.workers.dev}

# AI Advisor Configuration (Backend Secure LLM)
app.ai.api-key=${AI_API_KEY:}
app.ai.model=gemini-1.5-flash
app.ai.endpoint=https://generativelanguage.googleapis.com/v1beta/models
app.ai.timeout-seconds=15

# JWT Security Settings (256-bit secret, 24 hours expiration)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.resumeanalyzer=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
